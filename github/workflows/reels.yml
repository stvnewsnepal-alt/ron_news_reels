
name: Hamro Chitwan News Reels

on:
  schedule:
    - cron: "15 1 * * *"
    - cron: "15 8 * * *"
    - cron: "15 12 * * *"
    - cron: "15 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-extra

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Build and publish Reel
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_GRAPH_VERSION: "v23.0"
          BRAND_URL: "fb.com/ilovechitwan"
          BRAND_NAME: "Hamro Chitwan Ramro Chitwan"
          SOURCE_URLS: "https://www.nayapatrikadaily.com/,https://www.janaaastha.com/"
          NEPALI_VOICE: "ne-NP-SagarNeural"
          MAX_NEWS_AGE_HOURS: "18"
        run: python main.py
