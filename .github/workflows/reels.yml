name: Topic Reels
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1 = only build video (no post), 0 = publish"
        default: "1"
  schedule:
    - cron: "15 4 * * *"   # 10:00 AM Nepal time, daily

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: System deps (ffmpeg, Nepali font, text shaping)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core libraqm0 libfribidi0
      - name: Python deps
        run: pip install moviepy==1.0.3 pillow==9.5.0 edge-tts requests numpy
      - name: Run
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
        run: python topic_reels.py
      - uses: actions/upload-artifact@v4
        with:
          name: video
          path: out/*.mp4
      - name: Save posted topic history
        run: |
          git config user.name "bot"; git config user.email "bot@users.noreply.github.com"
          git add posted_topics.json || true
          git diff --cached --quiet || (git commit -m "Update posted topics" && git push)
