
name: Hamro Chitwan News Reels

on:
  schedule:
    - cron: "15 1,3,5,7,9,11,13 * * *"

  workflow_dispatch:
    inputs:
      dry_run:
        description: "1 = Test only, 0 = Publish to Facebook"
        required: true
        default: "1"

permissions:
  contents: write

concurrency:
  group: hamro-chitwan-news-reels
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      TTS_VOICE: ne-NP-SagarNeural
      MAX_AGE_HOURS: "12"
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || '0' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg and Nepali fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core

      - name: Install Python requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run news Reel automation
        run: |
          python main.py

      - name: Save published history
        if: success() && env.DRY_RUN == '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posted.json
          git diff --cached --quiet || git commit -m "Update published news history"
          git push
